{% extends 'base.html' %} {% block title %}Contact - My Flask Site{% endblock %}
{% block content %}
<div class="container py-5">
  <h1 class="text-center mb-5">Send love to Cayenne Pepper</h1>

  <div class="row">
    <!-- Map Column -->
    <div class="col-lg-6 mb-4">
      <div class="map-container">
        <img
          src="{{ url_for('static', filename='images/information1.jpeg') }}"
          width="100%"
          height="400"
          style="border: 0"
          allowfullscreen=""
          loading="lazy"
        >
        </iframe>
      </div>

      <!-- Contact Info (moved below map) -->
      <div class="contact-info mt-4">
        <h4>Other Ways to Reach Us</h4>
        <ul class="list-unstyled mb-0">
          <li class="mb-2">
            <strong>📍</strong> Bradleys Head Road, Mosman, NSW 2088
          </li>
          <li class="mb-2"><strong>📞</strong> (02) 9969 2777</li>
          <li>
            <strong>✉️</strong>
            <a href="mailto:info@myflasksite.com">info@myflasksite.com</a>
          </li>
        </ul>
      </div>
    </div>

    <!-- Form Column -->
    <div class="col-lg-6 mb-4">
      <div class="contact-form">
        <h4 class="mb-4">Send the Message</h4>

        <form action="#" method="POST">
          <!-- Name Field -->
          <div class="mb-3">
            <label for="name" class="form-label">Your Name *</label>
            <input
              type="text"
              class="form-control"
              id="name"
              name="name"
              placeholder="Anderdingus"
              required
            />
          </div>

          <!-- Email Field -->
          <div class="mb-3">
            <label for="email" class="form-label">Email Address *</label>
            <input
              type="email"
              class="form-control"
              id="email"
              name="email"
              placeholder="anderdingus@example.com"
              required
            />
          </div>

          <!-- Subject Field -->
          <div class="mb-3">
            <label for="subject" class="form-label">Subject</label>
            <select class="form-select" id="subject" name="subject">
              <option value="" selected>Choose a topic...</option>
              <option value="general">Performance issues</option>
              <option value="support">Support</option>
              <option value="feedback">Feedback</option>
              <option value="other">Other</option>
            </select>
          </div>

          <!-- Message Field -->
          <div class="mb-3">
            <label for="message" class="form-label">Message *</label>
            <textarea
              class="form-control"
              id="message"
              name="message"
              rows="5"
              placeholder="How can we help you?"
              required
            ></textarea>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="btn btn-primary btn-lg w-100">
            Send Message
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
