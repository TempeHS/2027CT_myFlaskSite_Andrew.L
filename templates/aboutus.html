{% extends 'base.html' %} {% block title %}Contact - My Flask Site{% endblock %}
{% block content %}
<div class="container py-5">
  <h1 class="text-center mb-5 scroll-reveal">What Is This Website?</h1>

  <div class="row">
    <!-- Map Column -->
    <div class="col-lg-6 mb-4 scroll-reveal">
      <div class="map-container">
        <img
          src="{{ url_for('static', filename='images/logo.png') }}"
          width="100%"
          height="500"
          style="border: 0"
          allowfullscreen=""
          loading="lazy"
        >
        </iframe>
      </div>

     <!-- Contact Info (moved below map) -->
      <div class="additional-info mt-4 text-center">
        <h4></h4>
        <ul class="list-unstyled mb-0">
          <li class="mb-2">
            <strong></strong>
            <a href="https://www.instagram.com/p/DbT9vpcEx7K/"></a>
                      </li>
          <li class="mb-2"><strong></strong></li>
          <li>
          </li>
        </ul>
      </div>
    </div>
    <!-- Read-Only Text Block -->
    <div class="col-lg-6 mb-4 scroll-reveal">
      <div class="contact-form">
        <h4 class="mb-4">A Little Bit About Me</h4>

  <div class="mb-3">
          <label for="cayenne-info" class="form-label">Information</label>
          <textarea class="form-control" id="cayenne-info" rows="20" readonly> MediON is a gaming and movie website, containing weekly articles about what is happening in the gaming and movie industry. This website is created by a Tempe High School student in year 9 and I hope you have fun viewing this site. 

For any issues that you would like to address with me, head over to the contact page to make a request.</textarea>

</div>
      </div>
    </div>
  </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const revealItems = document.querySelectorAll(".scroll-reveal");

    const observer = new IntersectionObserver(
      (entries) => {
        entries.forEach((entry) => {
          entry.target.classList.toggle("show", entry.isIntersecting);
        });
      },
      { threshold: 0.2 }
    );

    revealItems.forEach((item) => observer.observe(item));
  });
</script>
