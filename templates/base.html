<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}My Flask Site{% endblock %}</title>

    <!-- Bootstrap CSS from CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Your custom CSS -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />

    {% block extra_css %}{% endblock %}
  </head>
  <body>
    {% include 'partials/nav.html' %}

    <main>
      {% block content %}
      <!-- Page content goes here -->
      {% endblock %}
    </main>

    <!-- Bootstrap JavaScript from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    {% block extra_js %}{% endblock %}
    <footer class="site-footer">
      <div class="container py-2">
        <div class="d-flex justify-content-between align-items-center gap-3">
          <div class="d-flex w-50 gap-3">
            <a class="nav-link p-0" href="{{ url_for('information') }}"
              >Log In | Sign Up</a
            >
            <a class="nav-link p-0" href="{{ url_for('contact') }}"
              >Finding An Article?</a
            >
          </div>

          <form
            class="d-flex w-50 mb-0"
            role="search"
            method="GET"
            action="/search"
          >
            <input
              class="form-control me-2"
              type="search"
              name="q"
              placeholder="Search"
              aria-label="Search"
            />
            <button class="btn btn-outline-success" type="submit">
              Search
            </button>
          </form>
        </div>
      </div>
    </footer>
  </body>
</html>
